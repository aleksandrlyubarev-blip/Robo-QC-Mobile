name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: typecheck · build · verify:demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (web + gateway + libs)
        run: pnpm typecheck

      - name: Build web
        run: pnpm --filter @workspace/web run build

      - name: Verify demo flow
        run: pnpm --filter @workspace/web run verify:demo
